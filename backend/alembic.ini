[alembic]
# Path to migration scripts folder inside the backend directory
script_location = alembic

# A placeholder URL (our backend code dynamically overwrites this with DATABASE_URL at runtime)
sqlalchemy.url = postgresql://postgres:secretpassword@postgres_db:5432/inventory_mgmt

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S